name: Run Telegram Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system packages (optional)
        run: |
          sudo apt-get update
          # some OCR libs may need common build tools; adjust if you hit build errors
          sudo apt-get install -y build-essential libatlas-base-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject BOT_TOKEN (from secret) into LoveYou.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          # Replace the first BOT_TOKEN assignment in LoveYou.py with the secret value
          python - <<'PY'
import os, re, sys
p = 'LoveYou.py'
txt = open(p, 'r', encoding='utf-8').read()
token = os.environ.get('BOT_TOKEN','')
if not token:
    print('BOT_TOKEN not set in environment', file=sys.stderr)
# replace first occurrence like: BOT_TOKEN = "..."
new = re.sub(r'BOT_TOKEN\s*=\s*".*?"', f'BOT_TOKEN = "{token}"', txt, count=1)
open(p, 'w', encoding='utf-8').write(new)
print('Injected BOT_TOKEN into LoveYou.py')
PY

      - name: Run bot
        env:
          BOT_PORT: ${{ secrets.BOT_PORT }}            # optional, default in script is 8099
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}          # optional: comma-separated admin ids if you want to override
          FORWARD_CHANNEL: ${{ secrets.FORWARD_CHANNEL }} # optional
        run: |
          # This process runs until the script exits; Actions enforce a job-timeout.
          python LoveYou.p
